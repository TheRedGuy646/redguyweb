<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #000000;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <div id="memeBox"></div>

    <script>
        // Update these names to match your local file names
        const memes = [
            "meme1.jpg",
            "meme2.png",
            "meme3.jpg",
            "meme4.gif",
            "meme5.webp"
        ];

        const randomIndex = Math.floor(Math.random() * memes.length);
        
        document.getElementById("memeBox").innerHTML = `
            <img src="${memes[randomIndex]}" alt="Meme">
        `;
    </script>

</body>
</html>
