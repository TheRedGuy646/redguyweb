<!DOCTYPE html>
<html>
<head>
  <!-- This loads the Roboto font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* This sticks the button to the top right corner */
    .toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    /* Styles for when dark mode is turned on */
    .dark-mode {
      background-color: #121212;
      color: white;
    }
  </style>
</head>
<body>

  <!-- The Dark Mode Button -->
  <button class="toggle-btn" onclick="toggleDarkMode()">Dark Mode</button>

  <!-- Top text (Comic Sans) -->
  <p style="font-family: 'Comic Sans MS', 'Comic Sans', cursive;">This is being made, please wait!</p>

  <!-- Image -->
  <img src="wait.png" alt="Please wait graphic" width="300">

  <!-- Bottom text (Roboto) -->
  <p style="font-family: 'Roboto', sans-serif;">Created by Red Guy</p>

  <!-- The JavaScript that makes the button work -->
  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>

</body>
</html>
